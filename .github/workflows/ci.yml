name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/transaction-api-python
          - services/currency-converter/api
          - systems/fraud-score/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install and test
        run: |
          pip install -r ${{ matrix.service }}/requirements.txt
          cd ${{ matrix.service }} && pytest -v

  test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/transaction-api-node
          - services/currency-converter/client
          - systems/fraud-score/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package.json
      - name: Install and test
        run: |
          cd ${{ matrix.service }} && npm install && npm test

  test-rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - services/log-counter-rust
          - systems/fraud-score/scorer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cd ${{ matrix.project }} && cargo test

  build-images:
    runs-on: ubuntu-latest
    needs: [test-python, test-node, test-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Build transaction-api-python image
        run: docker build -t transaction-api-python:${{ github.sha }} services/transaction-api-python
      - name: Build transaction-api-node image
        run: docker build -t transaction-api-node:${{ github.sha }} services/transaction-api-node

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Create placeholder lambda
        run: |
          cd infra/terraform
          mkdir -p lambda
          echo 'exports.handler=async()=>({statusCode:200,body:"ok"})' > lambda/index.js
          zip lambda_placeholder.zip lambda/index.js
      - name: Validate
        run: cd infra/terraform && terraform init -backend=false && terraform validate

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run K8s manifests
        run: kubectl apply --dry-run=client -f infra/kubernetes/
